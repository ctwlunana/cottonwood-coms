# CI/CD for COMS: run the test suite against a real PostgreSQL, then deploy to Cloudflare Workers.
# Required repository secret: CLOUDFLARE_API_TOKEN (Account API token: Workers Scripts, R2, Hyperdrive, KV Edit; Account Settings Read).
name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coms
          POSTGRES_PASSWORD: coms_dev
          POSTGRES_DB: coms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://coms:coms_dev@localhost:5432/coms_test
      DATABASE_URL: postgres://coms:coms_dev@localhost:5432/coms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build (OpenNext) & deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c447c5c61dbf1fc6274969ac154f1672
