# Single-VPS deployment: app + PostgreSQL (NOTE: not tested in the development environment).
# Usage: cp .env.example .env (edit!) ; docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: coms
      POSTGRES_USER: coms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "coms"], interval: 10s, retries: 5 }
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://coms:${POSTGRES_PASSWORD}@db:5432/coms
      UPLOAD_DIR: /data/uploads
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    volumes: [uploads:/data/uploads]
    ports: ["127.0.0.1:3000:3000"]   # put Caddy/nginx with HTTPS in front
volumes: { dbdata: {}, uploads: {} }
